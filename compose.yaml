name: policy-reliability

x-runtime: &runtime
  build: .
  image: policy-reliability:local
  env_file: .env.v2
  environment: &environment
    DATABASE_URL: postgresql+psycopg://policy:${POSTGRES_PASSWORD:?Generate .env.v2}@db:5432/policy
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://object-store:8333
    S3_BUCKET: policies
    POLICY_DATA_DIR: /data
    MODEL_CACHE_DIR: /data/models
  volumes:
    - model-data:/data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: policy
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.v2}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U policy -d policy]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-store:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Generate .env.v2}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Generate .env.v2}
      S3_BUCKET: policies
    volumes:
      - object-data:/data
    restart: unless-stopped

  init:
    <<: *runtime
    command: python -m policy_lab.manage init
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_started

  api:
    <<: *runtime
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 6g

  worker:
    <<: *runtime
    command: python -m policy_lab.worker
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 8g

volumes:
  postgres-data:
  object-data:
  model-data:
